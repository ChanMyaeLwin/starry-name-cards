# Static production host for STARRY Name Cards.
server {
    listen 80;
    listen [::]:80;
    server_name cards.starrymm.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/starry-name-cards/acme;
        try_files $uri =404;
    }
    location / { return 301 https://cards.starrymm.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cards.starrymm.com;
    root /var/www/starry-name-cards/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/cards.starrymm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cards.starrymm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
}
